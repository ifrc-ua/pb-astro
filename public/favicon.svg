<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Знак сайту: жовта сота серед фіолетового — та сама думка, що й гекс-мозаїка
       Hero. Сота flat-top (вершини на 0°…300°), як у Hero.astro.
       У вкладці іконка живе в 16 px, тож тут лише одна сота: кільце з шести
       фіолетових сусідок при такому розмірі зливається в пляму (перевірено
       рендером). Повна квітка з 7 сот віддається на 180 px — apple-touch-icon.svg.
       Жовте завжди з ink-обводкою — §7 дизайн-системи. -->
  <rect width="32" height="32" rx="7" fill="#654EA3"/>
  <polygon points="26.20,16.00 21.10,24.83 10.90,24.83 5.80,16.00 10.90,7.17 21.10,7.17"
           fill="#FFEC08" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
